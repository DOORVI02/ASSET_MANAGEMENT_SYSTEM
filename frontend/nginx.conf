# nginx site config for the containerised deployment (see `Dockerfile`).
#
# Mirrors `vercel.json` deliberately and exactly: the SPA rewrite and every security header.
# Two deployment paths that quietly disagree about their Content-Security-Policy is how a
# CSP violation ships to one host and not the other, so these must be changed together.
# `${PORT}` is substituted at container start.

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `always` on every header: without it nginx omits them from error responses (404, 500),
    # and a 404 in a SPA is a real, user-reachable page.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://*.supabase.co https://api.cloudinary.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Default for everything the /assets/ block below doesn't claim — index.html above all.
    # Without it, browsers apply heuristic caching to index.html and a deploy can leave
    # someone loading an old shell that references bundles which no longer exist.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints everything under /assets/, so those files are immutable — a changed
    # file gets a new name. Anything else (index.html above all) must never be cached, or a
    # deploy leaves browsers loading an old index.html that points at deleted bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # add_header in a nested block replaces the parent's set rather than adding to it,
        # so the security headers have to be repeated here or this location would serve
        # every JS and CSS file with no CSP at all.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://*.supabase.co https://api.cloudinary.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Client-side routing: every unknown path is a route, not a missing file. This is the
    # nginx equivalent of vercel.json's rewrite to /index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
